; ============================================================
; ServerRoot.net — Supervisor Configuration v2.1
; Auto-starts ALL services on boot, restarts on failure
; Install: cp deploy/supervisord_serverroot.conf /etc/supervisor/conf.d/serverroot.conf
;          supervisorctl reread && supervisorctl update
; ============================================================

[program:serverroot_c2]
command=/bin/bash -c "source ~/.bashrc 2>/dev/null; exec python run_c2_server.py"
directory=/workspace
user=root
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stderr_logfile=/workspace/logs/c2_server.log
stdout_logfile=/workspace/logs/c2_server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH="/workspace",PYTHONUNBUFFERED="1"
priority=20

[program:serverroot_autonomous_loop]
command=/bin/bash -c "source ~/.bashrc 2>/dev/null; exec python3 swarm/autonomous_loop.py"
directory=/workspace
user=root
autostart=true
autorestart=true
startsecs=5
startretries=99
stopasgroup=true
killasgroup=true
stderr_logfile=/workspace/logs/autonomous_loop.log
stdout_logfile=/workspace/logs/autonomous_loop.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONPATH="/workspace",PYTHONUNBUFFERED="1"
priority=40

